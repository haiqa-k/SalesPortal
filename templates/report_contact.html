<!DOCTYPE html>
<html>
<head>
    <title>Report Customer Contact</title>

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            margin: 0;
            min-height: 100vh;

            background: linear-gradient(
                to bottom,
                #c62828,
                #4b0082
            );

            color: #ffffff;
            font-family: Arial, sans-serif;
        }


        /* =========================
           TOP BAR
        ========================= */

        .topbar {
            min-height: 85px;
            padding: 15px 35px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            background: rgba(0, 0, 0, 0.25);
        }

        .logo {
            width: 110px;
        }

        .user-info {
            font-size: 14px;
        }


        /* =========================
           PAGE
        ========================= */

        .page-container {
            max-width: 760px;
            margin: 45px auto;
            padding: 0 20px 50px;
        }

        .page-title {
            font-size: 30px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .page-subtitle {
            color: rgba(255,255,255,0.75);
            margin-bottom: 25px;
        }


        /* =========================
           ACCOUNT CARD
        ========================= */

        .account-card {
            background: rgba(0,0,0,0.28);

            border: 1px solid
                rgba(255,255,255,0.12);

            border-radius: 10px;

            padding: 18px 22px;
            margin-bottom: 20px;
        }

        .account-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: rgba(255,255,255,0.65);
        }

        .account-name {
            font-size: 21px;
            font-weight: 700;
            margin-top: 3px;
        }

        .account-meta {
            margin-top: 5px;
            color: rgba(255,255,255,0.75);
            font-size: 14px;
        }


        /* =========================
           FORM CARD
        ========================= */

        .form-card {
            background: #151515;

            border-radius: 12px;

            padding: 28px;

            box-shadow:
                0 12px 30px rgba(0,0,0,0.35);
        }

        .form-label {
            font-weight: 600;
            margin-bottom: 8px;
        }

        .required {
            color: #ff6b6b;
        }

        .form-control,
        .form-select {
            background: #242424;
            border: 1px solid #444;
            color: #ffffff;
        }

        .form-control:focus,
        .form-select:focus {
            background: #242424;
            color: #ffffff;

            border-color: #c62828;

            box-shadow:
                0 0 0 0.2rem
                rgba(198,40,40,0.2);
        }

        .form-select option {
            background: #242424;
            color: #ffffff;
        }

        /* =========================
        DATE / TIME ICONS
        ========================= */

        .picker-wrap {
            position: relative;
        }

        .picker-wrap .form-control {
            padding-right: 48px;
        }

        .picker-icon {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 22px;
            height: 22px;
            color: #ffffff;
            opacity: 0.95;
            cursor: pointer;
            z-index: 3;
            pointer-events: auto;
        }

        .picker-icon:hover {
            opacity: 1;
        }

        .picker-icon svg {
            display: block;
            width: 100%;
            height: 100%;
            stroke: currentColor;
        }

        /* Hide the browser's dark native indicator. The custom icon opens the same picker. */
        input[type="date"]::-webkit-calendar-picker-indicator,
        input[type="time"]::-webkit-calendar-picker-indicator {
            opacity: 0;
            position: absolute;
            right: 0;
            width: 46px;
            height: 100%;
            cursor: pointer;
        }


        /* =========================
           CONTACT TYPE
        ========================= */

        .contact-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .contact-option input {
            display: none;
        }

        .contact-option label {
            width: 100%;

            padding: 15px;

            text-align: center;

            background: #242424;

            border: 1px solid #444;
            border-radius: 8px;

            cursor: pointer;

            font-weight: 600;

            transition: 0.2s;
        }

        .contact-option label:hover {
            border-color: #888;
        }

        .contact-option input:checked + label {
            background: linear-gradient(
                to right,
                rgba(198,40,40,0.8),
                rgba(75,0,130,0.8)
            );

            border-color: rgba(255,255,255,0.5);
        }


        /* =========================
           STAGE REQUIREMENTS
        ========================= */

        .stage-requirement {
            display: none;
            margin-bottom: 1.5rem;
            padding: 16px;
            background: #202020;
            border: 1px solid #3f3f3f;
            border-radius: 8px;
        }

        .stage-requirement.visible {
            display: block;
        }

        .stage-options {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 8px;
        }

        .stage-option {
            position: relative;
            flex: 1 1 230px;
            cursor: pointer;
            margin: 0;
        }

        .stage-option input {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }

        .stage-option-box {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 14px;
            background: #242424;
            border: 1px solid #444;
            border-radius: 7px;
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
        }

        .stage-option-box::before {
            content: "";
            width: 16px;
            height: 16px;
            flex: 0 0 16px;
            border: 1px solid #777;
            border-radius: 3px;
        }

        .stage-option input:checked + .stage-option-box {
            background: linear-gradient(
                to right,
                rgba(198,40,40,0.65),
                rgba(75,0,130,0.65)
            );
            border-color: rgba(255,255,255,0.5);
        }

        .stage-option input:checked + .stage-option-box::before {
            background: #c62828;
            border-color: #ff9e96;
            box-shadow: inset 0 0 0 3px #242424;
        }


        /* =========================
           COMMENTS
        ========================= */

        textarea {
            resize: vertical;
            min-height: 105px;
        }

        .word-counter {
            text-align: right;
            font-size: 12px;
            color: #aaa;
            margin-top: 5px;
        }

        .word-counter.limit {
            color: #ff6b6b;
        }


        /* =========================
           BUTTONS
        ========================= */

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;

            margin-top: 28px;
        }

        .btn-cancel {
            background: transparent;
            color: #ffffff;

            border: 1px solid #777;

            padding: 9px 20px;
            border-radius: 6px;

            text-decoration: none;
        }

        .btn-cancel:hover {
            color: #ffffff;
            background: #333;
        }

        .btn-submit {
            border: none;

            background: linear-gradient(
                to right,
                #c62828,
                #4b0082
            );

            color: #ffffff;

            padding: 10px 24px;

            border-radius: 6px;

            font-weight: 600;
        }

        .btn-submit:hover {
            opacity: 0.9;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .topbar {
                padding: 15px 20px;
            }

            .logo {
                width: 90px;
            }

            .page-container {
                margin-top: 25px;
            }

            .form-card {
                padding: 20px;
            }

            .contact-options {
                grid-template-columns: 1fr;
            }

            .form-actions {
                flex-direction: column-reverse;
            }

            .btn-cancel,
            .btn-submit {
                width: 100%;
                text-align: center;
            }
        }

    </style>
</head>


<body>


<!-- =========================
     TOP BAR
========================= -->

<div class="topbar">

    <img
        src="{{ url_for('static', filename='jazz-logo.png') }}"
        alt="Company Logo"
        class="logo"
    >

    <div class="user-info">
        Logged in as
        <strong>{{ edo_name }}</strong>
    </div>

</div>


<!-- =========================
     PAGE
========================= -->

<div class="page-container">

    <div class="page-title">
        Report Contact
    </div>

    <div class="page-subtitle">
        Record a customer call or visit for this pipeline.
    </div>


    <!-- ACCOUNT -->

    <div class="account-card">

        <div class="account-label">
            Account
        </div>

        <div class="account-name">
            {{ pipeline.AccountName }}
        </div>

        <div class="account-meta">
            {{ pipeline.Product }}

            {% if pipeline.SalesCycleStatus %}
                &nbsp;•&nbsp;
                Current Status:
                {{ pipeline.SalesCycleStatus }}
            {% endif %}
        </div>

    </div>


    <!-- =========================
         FORM
    ========================= -->

    <form
        method="POST"
        id="contactForm"
        class="form-card"
    >


        <!-- CONTACT TYPE -->

        <div class="mb-4">

            <label class="form-label">
                Contact Type
                <span class="required">*</span>
            </label>

            <div class="contact-options">

                <div class="contact-option">

                    <input
                        type="radio"
                        id="contactCall"
                        name="contact_type"
                        value="Call"
                        required
                    >

                    <label for="contactCall">
                        Call
                    </label>

                </div>


                <div class="contact-option">

                    <input
                        type="radio"
                        id="contactVisit"
                        name="contact_type"
                        value="Visit"
                        required
                    >

                    <label for="contactVisit">
                        Visit
                    </label>

                </div>

            </div>

        </div>


        <!-- DATE + TIME -->

        <div class="row">

            <div class="col-md-6 mb-4">

                <label
                    for="contactDate"
                    class="form-label"
                >
                    Contact Date
                    <span class="required">*</span>
                </label>

                <div class="picker-wrap">
                    <input
                        type="date"
                        id="contactDate"
                        name="contact_date"
                        class="form-control"
                        required
                    >
                    <span class="picker-icon" data-picker="contactDate" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="5" width="18" height="16" rx="2"></rect>
                            <path d="M16 3v4M8 3v4M3 10h18"></path>
                        </svg>
                    </span>
                </div>

            </div>


            <div class="col-md-6 mb-4">

                <label
                    for="contactTime"
                    class="form-label"
                >
                    Contact Time
                    <span class="required">*</span>
                </label>

                <div class="picker-wrap">
                    <input
                        type="time"
                        id="contactTime"
                        name="contact_time"
                        class="form-control"
                        required
                    >
                    <span class="picker-icon" data-picker="contactTime" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="9"></circle>
                            <path d="M12 7v5l3 2"></path>
                        </svg>
                    </span>
                </div>

            </div>

        </div>


        <!-- STATUS -->

        <div class="mb-4">

            <label
                for="status"
                class="form-label"
            >
                Sales Cycle Status
                <span class="required">*</span>
            </label>

            <select
                id="status"
                name="status"
                class="form-select"
                required
            >

                <option value="">
                    Select Status
                </option>

                <option
                    value="Customer Visit (20%)"
                    {% if pipeline.SalesCycleStatus == 'Customer Visit (20%)' %}
                        selected
                    {% endif %}
                >
                    Customer Visit (20%)
                </option>

                <option
                    value="Ask for Proposal (40%)"
                    {% if pipeline.SalesCycleStatus == 'Ask for Proposal (40%)' %}
                        selected
                    {% endif %}
                >
                    Ask for Proposal (40%)
                </option>

                <option
                    value="Negotiations (60%)"
                    {% if pipeline.SalesCycleStatus == 'Negotiations (60%)' %}
                        selected
                    {% endif %}
                >
                    Negotiations (60%)
                </option>

                <option
                    value="Documentation/Acceptance/Processing (80%)"
                    {% if pipeline.SalesCycleStatus == 'Documentation/Acceptance/Processing (80%)' %}
                        selected
                    {% endif %}
                >
                    Documentation/Acceptance/Processing (80%)
                </option>

                <option
                    value="System Entry/Revenue Locked (100%)"
                    {% if pipeline.SalesCycleStatus == 'System Entry/Revenue Locked (100%)' %}
                        selected
                    {% endif %}
                >
                    System Entry/Revenue Locked (100%)
                </option>

                <option
                    value="Lost to Competitor"
                    {% if pipeline.SalesCycleStatus == 'Lost to Competitor' %}
                        selected
                    {% endif %}
                >
                    Lost to Competitor
                </option>

                <option
                    value="Retired - No Decision"
                    {% if pipeline.SalesCycleStatus == 'Retired - No Decision' %}
                        selected
                    {% endif %}
                >
                    Retired - No Decision
                </option>

            </select>

        </div>


        <!-- 40% PROPOSAL STATUS -->

        <div
            class="stage-requirement"
            id="proposalStatusGroup"
        >
            <label class="form-label">
                Proposal Status
                <span class="required">*</span>
            </label>

            <div class="stage-options">

                <label class="stage-option">
                    <input
                        type="radio"
                        name="proposal_status"
                        value="Pending"
                        {% if pipeline.ProposalStatus == 'Pending' %}checked{% endif %}
                    >
                    <span class="stage-option-box">
                        Proposal Pending
                    </span>
                </label>

                <label class="stage-option">
                    <input
                        type="radio"
                        name="proposal_status"
                        value="Sent"
                        {% if pipeline.ProposalStatus == 'Sent' %}checked{% endif %}
                    >
                    <span class="stage-option-box">
                        Proposal Sent
                    </span>
                </label>

            </div>
        </div>


        <!-- 80% DECISION MAKER STATUS -->

        <div
            class="stage-requirement"
            id="decisionMakerStatusGroup"
        >
            <label class="form-label">
                Decision Maker Status
                <span class="required">*</span>
            </label>

            <div class="stage-options">

                <label class="stage-option">
                    <input
                        type="radio"
                        name="decision_maker_status"
                        value="Not Engaged"
                        {% if pipeline.DecisionMakerStatus == 'Not Engaged' %}checked{% endif %}
                    >
                    <span class="stage-option-box">
                        Decision Maker Not Engaged
                    </span>
                </label>

                <label class="stage-option">
                    <input
                        type="radio"
                        name="decision_maker_status"
                        value="Engaged"
                        {% if pipeline.DecisionMakerStatus == 'Engaged' %}checked{% endif %}
                    >
                    <span class="stage-option-box">
                        Decision Maker Engaged
                    </span>
                </label>

            </div>
        </div>


        <!-- COMMENTS -->

        <div class="mb-2">

            <label
                for="comments"
                class="form-label"
            >
                Comments
            </label>

            <textarea
                id="comments"
                name="comments"
                class="form-control"
                placeholder="Briefly describe the customer interaction..."
            ></textarea>

            <div
                id="wordCounter"
                class="word-counter"
            >
                0 / 20 words
            </div>

        </div>


        <!-- BUTTONS -->

        <div class="form-actions">

            <a
                href="{{ url_for('my_pipelines') }}"
                class="btn-cancel"
            >
                Cancel
            </a>

            <button
                type="submit"
                class="btn-submit"
            >
                Submit Contact
            </button>

        </div>

    </form>

</div>


<script>

    /* =========================
       CUSTOM DATE / TIME ICONS
    ========================= */

    document.querySelectorAll(".picker-icon").forEach(function (icon) {
        icon.addEventListener("click", function () {
            const input = document.getElementById(icon.dataset.picker);
            if (!input) return;

            if (typeof input.showPicker === "function") {
                input.showPicker();
            } else {
                input.focus();
                input.click();
            }
        });
    });


    /* =========================
       STAGE REQUIREMENTS
    ========================= */

    const statusInput =
        document.getElementById("status");

    const proposalStatusGroup =
        document.getElementById(
            "proposalStatusGroup"
        );

    const decisionMakerStatusGroup =
        document.getElementById(
            "decisionMakerStatusGroup"
        );

    const proposalStatusInputs =
        document.querySelectorAll(
            'input[name="proposal_status"]'
        );

    const decisionMakerStatusInputs =
        document.querySelectorAll(
            'input[name="decision_maker_status"]'
        );


    function setStageRequired(
        inputs,
        required
    ) {
        inputs.forEach(
            function (input) {
                input.required = required;
            }
        );
    }


    function updateStageRequirements() {

        const proposalStage =
            statusInput.value ===
            "Ask for Proposal (40%)";

        const decisionStage =
            statusInput.value ===
            "Documentation/Acceptance/Processing (80%)";

        proposalStatusGroup.classList.toggle(
            "visible",
            proposalStage
        );

        decisionMakerStatusGroup.classList.toggle(
            "visible",
            decisionStage
        );

        setStageRequired(
            proposalStatusInputs,
            proposalStage
        );

        setStageRequired(
            decisionMakerStatusInputs,
            decisionStage
        );
    }


    statusInput.addEventListener(
        "change",
        updateStageRequirements
    );

    updateStageRequirements();


    /* =========================
       20 WORD LIMIT
    ========================= */

    const comments =
        document.getElementById("comments");

    const wordCounter =
        document.getElementById("wordCounter");


    function getWords(text) {

        const trimmed = text.trim();

        if (!trimmed) {
            return [];
        }

        return trimmed.split(/\s+/);
    }


    comments.addEventListener(
        "input",
        function () {

            let words =
                getWords(comments.value);


            if (words.length > 20) {

                words = words.slice(0, 20);

                comments.value =
                    words.join(" ");
            }


            const count =
                getWords(comments.value).length;


            wordCounter.textContent =
                count + " / 20 words";


            if (count >= 20) {

                wordCounter.classList.add(
                    "limit"
                );

            } else {

                wordCounter.classList.remove(
                    "limit"
                );
            }

        }
    );


    /* =========================
       PREVENT FUTURE DATE/TIME
    ========================= */

    const contactDate =
        document.getElementById("contactDate");


    const today =
        new Date();


    const year =
        today.getFullYear();

    const month =
        String(
            today.getMonth() + 1
        ).padStart(2, "0");

    const day =
        String(
            today.getDate()
        ).padStart(2, "0");


    contactDate.max =
        `${year}-${month}-${day}`;

</script>


</body>
</html>
