<!DOCTYPE html>

<html>

<head>

    <title>Change Password</title>

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    >


    <style>

        body {

            margin: 0;

            min-height: 100vh;

            background: linear-gradient(
                to bottom,
                #c62828,
                #4b0082
            );

            font-family: Arial, sans-serif;

            display: flex;

            justify-content: center;
            align-items: center;

        }


        .password-card {

            width: 100%;
            max-width: 430px;

            background: rgba(
                20,
                20,
                20,
                0.95
            );

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.15
                );

            border-radius: 12px;

            padding: 35px;

            box-shadow:
                0 15px 40px
                rgba(
                    0,
                    0,
                    0,
                    0.4
                );

        }


        .logo {

            display: block;

            width: 150px;

            margin:
                0 auto
                25px auto;

        }


        .page-title {

            color: #ffffff;

            font-size: 28px;
            font-weight: 600;

            margin-bottom: 8px;

            text-align: center;

        }


        .page-subtitle {

            color:
                rgba(
                    255,
                    255,
                    255,
                    0.65
                );

            font-size: 13px;

            text-align: center;

            margin-bottom: 28px;

        }


        label {

            color: #dddddd;

            font-size: 13px;

            margin-bottom: 7px;

        }


        .form-control {

            background: #222222;

            border:
                1px solid
                #444444;

            color: #ffffff;

            padding: 11px 12px;

        }


        .form-control:focus {

            background: #222222;

            color: #ffffff;

            border-color:
                rgba(
                    255,
                    255,
                    255,
                    0.5
                );

            box-shadow: none;

        }


        .form-control::placeholder {

            color: #777777;

        }


        .password-container {

            position: relative;

            width: 100%;

        }


        .password-container .form-control {

            padding-right: 45px;

        }


        .toggle-eye {

            position: absolute;

            right: 12px;

            top: 50%;

            transform: translateY(-50%);

            cursor: pointer;

            font-size: 18px;

            user-select: none;

        }


        .btn-change {

            width: 100%;

            margin-top: 10px;

            padding: 11px;

            border: none;

            border-radius: 6px;

            color: #ffffff;

            font-weight: 600;

            background: linear-gradient(
                to right,
                #c62828,
                #4b0082
            );

        }


        .btn-change:hover {

            opacity: 0.9;

        }


        .back-link {

            display: block;

            text-align: center;

            margin-top: 20px;

            color:
                rgba(
                    255,
                    255,
                    255,
                    0.75
                );

            text-decoration: none;

            font-size: 13px;

        }


        .back-link:hover {

            color: #ffffff;

        }


        .message {

            padding: 10px 12px;

            margin-bottom: 20px;

            border-radius: 5px;

            font-size: 13px;

        }


        .message.error {

            background:
                rgba(
                    198,
                    40,
                    40,
                    0.25
                );

            border:
                1px solid
                rgba(
                    255,
                    100,
                    100,
                    0.4
                );

            color: #ffb3b3;

        }


        .message.success {

            background:
                rgba(
                    40,
                    167,
                    69,
                    0.2
                );

            border:
                1px solid
                rgba(
                    100,
                    220,
                    130,
                    0.4
                );

            color: #b6f2c2;

        }

    </style>

</head>


<body>


<div class="password-card">


    <img
        src="{{ url_for('static', filename='jazz-logo.png') }}"
        class="logo"
        alt="Company Logo"
    >


    <div class="page-title">
        Change Password
    </div>


    <div class="page-subtitle">
        Enter your current credentials
        and choose a new password.
    </div>



    {% if message %}

    <div class="message {{ message_type }}">
        {{ message }}
    </div>

    {% endif %}



    <form
        method="POST"
        action="{{ url_for('change_password') }}"
    >


        <div class="mb-3">

            <label>
                Username
            </label>

            <input
                type="text"
                name="username"
                class="form-control"
                required
                autocomplete="username"
            >

        </div>



        <div class="mb-3">

            <label>
                Current Password
            </label>

            <div class="password-container">

                <input
                    type="password"
                    id="current_password"
                    name="current_password"
                    class="form-control"
                    required
                    autocomplete="current-password"
                >

                <span
                    class="toggle-eye"
                    onclick="togglePassword('current_password', this)"
                >
                    👁️
                </span>

            </div>

        </div>



        <div class="mb-3">

            <label>
                New Password
            </label>

            <div class="password-container">

                <input
                    type="password"
                    id="new_password"
                    name="new_password"
                    class="form-control"
                    required
                    minlength="8"
                    autocomplete="new-password"
                >

                <span
                    class="toggle-eye"
                    onclick="togglePassword('new_password', this)"
                >
                    👁️
                </span>

            </div>

        </div>



        <div class="mb-3">

            <label>
                Confirm New Password
            </label>

            <div class="password-container">

                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    class="form-control"
                    required
                    minlength="8"
                    autocomplete="new-password"
                >

                <span
                    class="toggle-eye"
                    onclick="togglePassword('confirm_password', this)"
                >
                    👁️
                </span>

            </div>

        </div>



        <button
            type="submit"
            class="btn-change"
        >
            Change Password
        </button>


    </form>



    <a
        href="{{ url_for('login') }}"
        class="back-link"
    >
        ← Back to Login
    </a>


</div>


<script>

    function togglePassword(fieldId, eyeIcon) {

        const passwordField =
            document.getElementById(fieldId);


        if (passwordField.type === "password") {

            passwordField.type = "text";

            eyeIcon.textContent = "🙈";

        }

        else {

            passwordField.type = "password";

            eyeIcon.textContent = "👁️";

        }

    }

</script>


</body>

</html>
