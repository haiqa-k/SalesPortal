<!DOCTYPE html>
<html>
<head>
    <title>Edit Pipeline</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <style>
    body {
        /* Gradient from bright red to deep purple */
        background: linear-gradient(to bottom, #e52e2e, #4b0082);
        min-height: 100vh;
        color: #fff;
        font-family: 'Segoe UI', Roboto, sans-serif;
    }

    .container {
        background: rgba(255, 255, 255, 0.1);
        padding: 30px;
        border-radius: 10px;
        margin-top: 50px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    h1 {
        font-weight: 600;
        margin-bottom: 20px;
        color: #fff;
    }

    .form-label {
        font-weight: 500;
        color: #fff;
    }

    .form-control, .form-select {
        background-color: rgba(255, 255, 255, 0.15);
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .form-control:focus, .form-select:focus {
        background-color: rgba(255, 255, 255, 0.25);
        border-color: #fff;
        box-shadow: none;
    }

    /* Fix dropdown visibility */
    .form-select option {
        background-color: #fff;   /* white background for options */
        color: #000;              /* black text for readability */
    }

    .btn-primary {
        background: linear-gradient(to right, #e52e2e, #4b0082);
        border: none;
    }

    .btn-primary:hover {
        background: linear-gradient(to right, #c62828, #3a0066);
    }

    .btn-secondary {
        background-color: rgba(255, 255, 255, 0.2);
        border: none;
        color: #fff;
    }

    .btn-secondary:hover {
        background-color: rgba(255, 255, 255, 0.35);
    }
    </style>
</head>
<body>

<div class="container">
    <h1>{{ pipeline[1] }}</h1>

    <form method="POST">
        <!-- Calendar input -->
        <div class="mb-3">
            <label class="form-label">Estimated Closure Date</label>
            <input type="date" name="closure_date" class="form-control" value="{{ pipeline[2] }}">
            <small class="text-light">
                Pick a full date — the system will save the day and month separately.
            </small>
        </div>

        <!-- Next Action -->
        <div class="mb-3">
            <label class="form-label">Next Action</label>
            <input type="text" name="next_action" class="form-control" value="{{ pipeline[4] }}">
        </div>

        <!-- Sales Cycle Status -->
        <div class="mb-3">
            <label class="form-label">Sales Cycle Status</label>
            <select name="status" class="form-select">
                {% for s in statuses %}
                    <option value="{{ s }}" {% if s == pipeline[5] %}selected{% endif %}>{{ s }}</option>
                {% endfor %}
            </select>
        </div>

        <button type="submit" class="btn btn-primary">Save Changes</button>
        <a href="{{ url_for('my_pipelines') }}" class="btn btn-secondary">Cancel</a>
    </form>
</div>

</body>
</html>
