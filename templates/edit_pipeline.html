<!DOCTYPE html>

<html>

<head>

    <title>Edit Pipeline</title>

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    >

    <style>

    body {

        /* Gradient from bright red to deep purple */

        background:
            linear-gradient(
                to bottom,
                #e52e2e,
                #4b0082
            );

        min-height: 100vh;

        color: #fff;

        font-family:
            'Segoe UI',
            Roboto,
            sans-serif;
    }


    .container {

        background:
            rgba(
                255,
                255,
                255,
                0.1
            );

        padding: 30px;

        border-radius: 10px;

        margin-top: 50px;

        box-shadow:
            0 4px 20px
            rgba(
                0,
                0,
                0,
                0.3
            );
    }


    h1 {

        font-weight: 600;

        margin-bottom: 20px;

        color: #fff;
    }


    .form-label {

        font-weight: 500;

        color: #fff;
    }


    .form-control,
    .form-select {

        background-color:
            rgba(
                255,
                255,
                255,
                0.15
            );

        color: #fff;

        border:
            1px solid
            rgba(
                255,
                255,
                255,
                0.3
            );
    }


    .form-control:focus,
    .form-select:focus {

        background-color:
            rgba(
                255,
                255,
                255,
                0.25
            );

        color: #fff;

        border-color: #fff;

        box-shadow: none;
    }


    /* Fix dropdown visibility */

    .form-select option {

        background-color: #fff;

        color: #000;
    }


    .btn-primary {

        background:
            linear-gradient(
                to right,
                #e52e2e,
                #4b0082
            );

        border: none;
    }


    .btn-primary:hover {

        background:
            linear-gradient(
                to right,
                #c62828,
                #3a0066
            );
    }


    .btn-secondary {

        background-color:
            rgba(
                255,
                255,
                255,
                0.2
            );

        border: none;

        color: #fff;
    }


    .btn-secondary:hover {

        background-color:
            rgba(
                255,
                255,
                255,
                0.35
            );
    }


    /* =========================
       EXTENSION REASON MODAL
       ========================= */

    .extension-modal .modal-content {

        background: #1b1b1b;

        color: #ffffff;

        border:
            1px solid #414141;

        border-radius: 12px;

        box-shadow:
            0 20px 55px
            rgba(
                0,
                0,
                0,
                0.55
            );
    }


    .extension-modal .modal-header {

        border-bottom:
            1px solid #333333;
    }


    .extension-modal .modal-footer {

        border-top:
            1px solid #333333;
    }


    .extension-modal .modal-title {

        font-size: 19px;

        font-weight: 600;
    }


    .extension-modal-message {

        color: #c2c2c2;

        font-size: 13px;

        line-height: 1.6;

        margin-bottom: 14px;
    }


    .extension-count-badge {

        display: inline-block;

        padding: 4px 8px;

        margin-bottom: 13px;

        border-radius: 5px;

        background:
            rgba(
                198,
                40,
                40,
                0.22
            );

        color: #ff9e96;

        border:
            1px solid
            rgba(
                255,
                138,
                128,
                0.28
            );

        font-size: 12px;

        font-weight: 600;
    }


    #extensionReasonInput {

        min-height: 110px;

        resize: vertical;

        background: #262626;

        color: #ffffff;

        border:
            1px solid #484848;
    }


    #extensionReasonInput::placeholder {

        color: #8f8f8f;
    }


    #extensionReasonInput:focus {

        background: #2b2b2b;

        border-color: #c62828;

        color: #ffffff;

        box-shadow:
            0 0 0 0.2rem
            rgba(
                198,
                40,
                40,
                0.16
            );
    }


    .extension-error {

        display: none;

        margin-top: 8px;

        color: #ff8a80;

        font-size: 12px;
    }

    </style>

</head>


<body>


<div class="container">

    <h1>
        {{ pipeline[1] }}
    </h1>


    <form
        method="POST"
        id="editPipelineForm"
    >

        <!-- Extension reason submitted only when required -->

        <input
            type="hidden"
            name="extension_reason"
            id="extensionReason"
            value=""
        >


        <!-- Calendar input -->

        <div class="mb-3">

            <label class="form-label">
                Estimated Closure Date
            </label>

            <input
                type="date"
                name="closure_date"
                id="closure_date"
                class="form-control"
                value="{{
                    pipeline[6].strftime('%Y-%m-%d')
                    if pipeline[6]
                    else ''
                }}"
            >

            <small class="text-light">
                Pick a full date — the system will save
                the day and month separately.
            </small>

        </div>


        <!-- Next Action -->

        <div class="mb-3">

            <label class="form-label">
                Next Action
            </label>

            <input
                type="text"
                name="next_action"
                class="form-control"
                value="{{ pipeline[4] or '' }}"
            >

        </div>


        <!-- Sales Cycle Status -->

        <div class="mb-3">

            <label class="form-label">
                Sales Cycle Status
            </label>

            <select
                name="status"
                id="status"
                class="form-select"
            >

                {% for s in statuses %}

                    <option
                        value="{{ s }}"
                        {% if s == pipeline[5] %}
                            selected
                        {% endif %}
                    >
                        {{ s }}
                    </option>

                {% endfor %}

            </select>

        </div>


        <button
            type="submit"
            class="btn btn-primary"
        >
            Save Changes
        </button>


        <a
            href="{{ url_for('my_pipelines') }}"
            class="btn btn-secondary"
        >
            Cancel
        </a>

    </form>

</div>


<!-- =========================================================
     REPEATED EXTENSION REASON POPUP
     ========================================================= -->

<div
    class="modal fade extension-modal"
    id="extensionReasonModal"
    tabindex="-1"
    aria-labelledby="extensionReasonModalLabel"
    aria-hidden="true"
>

    <div
        class="modal-dialog modal-dialog-centered"
    >

        <div class="modal-content">

            <div class="modal-header">

                <h5
                    class="modal-title"
                    id="extensionReasonModalLabel"
                >
                    Closure Date Extension
                </h5>

                <button
                    type="button"
                    class="btn-close btn-close-white"
                    data-bs-dismiss="modal"
                    aria-label="Close"
                ></button>

            </div>


            <div class="modal-body">

                <div
                    class="extension-count-badge"
                    id="extensionCountBadge"
                >
                    Repeated Extension
                </div>


                <p
                    class="extension-modal-message"
                    id="extensionReasonMessage"
                >
                </p>


                <label
                    for="extensionReasonInput"
                    class="form-label"
                >
                    Reason for extension
                </label>


                <textarea
                    id="extensionReasonInput"
                    class="form-control"
                    maxlength="1000"
                    placeholder="Enter the reason for pushing the closure date..."
                ></textarea>


                <div
                    id="extensionReasonError"
                    class="extension-error"
                >
                    Please enter a reason before continuing.
                </div>

            </div>


            <div class="modal-footer">

                <button
                    type="button"
                    class="btn btn-secondary"
                    data-bs-dismiss="modal"
                >
                    Cancel
                </button>


                <button
                    type="button"
                    class="btn btn-primary"
                    id="confirmExtensionReason"
                >
                    Confirm Update
                </button>

            </div>

        </div>

    </div>

</div>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js">
</script>


<script>

document.addEventListener(
    'DOMContentLoaded',
    function () {

        const editForm =
            document.getElementById(
                'editPipelineForm'
            );

        const closureDateInput =
            document.getElementById(
                'closure_date'
            );

        const statusInput =
            document.getElementById(
                'status'
            );

        const reasonHidden =
            document.getElementById(
                'extensionReason'
            );

        const reasonInput =
            document.getElementById(
                'extensionReasonInput'
            );

        const reasonError =
            document.getElementById(
                'extensionReasonError'
            );

        const reasonMessage =
            document.getElementById(
                'extensionReasonMessage'
            );

        const countBadge =
            document.getElementById(
                'extensionCountBadge'
            );

        const confirmButton =
            document.getElementById(
                'confirmExtensionReason'
            );

        const modalElement =
            document.getElementById(
                'extensionReasonModal'
            );


        const isEdo =
            {{ 'true' if is_edo else 'false' }};

        const originalClosureDate =
            {{ original_closure_date | tojson }};

        const originalStatus =
            {{ original_status | tojson }};

        const previousExtensionCount =
            {{ previous_extension_count | int }};


        const extensionModal =
            new bootstrap.Modal(
                modalElement
            );


        let reasonConfirmed =
            false;


        function isForwardDatePush() {

            if (
                !originalClosureDate ||
                !closureDateInput.value
            ) {
                return false;
            }


            const oldDate =
                new Date(
                    originalClosureDate +
                    'T00:00:00'
                );

            const newDate =
                new Date(
                    closureDateInput.value +
                    'T00:00:00'
                );


            return (
                newDate > oldDate
            );
        }


        function statusHasChanged() {

            return (
                statusInput.value !==
                originalStatus
            );
        }


        function shouldRequireReason() {

            if (!isEdo) {
                return false;
            }


            if (!isForwardDatePush()) {
                return false;
            }


            if (statusHasChanged()) {
                return false;
            }


            const thisExtensionNumber =
                previousExtensionCount + 1;


            return (
                thisExtensionNumber >= 3
            );
        }


        function openReasonPopup() {

            const thisExtensionNumber =
                previousExtensionCount + 1;


            countBadge.textContent =
                'Extension ' +
                thisExtensionNumber;


            reasonMessage.textContent =
                'This pipeline has already had 2 or more closure-date ' +
                'extensions without a Sales Cycle Status change. ' +
                'Please provide a reason for extension ' +
                thisExtensionNumber +
                ' before the date is updated.';


            reasonError.style.display =
                'none';


            extensionModal.show();


            modalElement.addEventListener(
                'shown.bs.modal',
                function focusReason() {

                    reasonInput.focus();

                    modalElement.removeEventListener(
                        'shown.bs.modal',
                        focusReason
                    );
                }
            );
        }


        editForm.addEventListener(
            'submit',
            function (event) {

                if (reasonConfirmed) {
                    return;
                }


                if (shouldRequireReason()) {

                    event.preventDefault();

                    openReasonPopup();
                }
            }
        );


        confirmButton.addEventListener(
            'click',
            function () {

                const reason =
                    reasonInput.value.trim();


                if (!reason) {

                    reasonError.style.display =
                        'block';

                    return;
                }


                reasonError.style.display =
                    'none';


                reasonHidden.value =
                    reason;


                reasonConfirmed =
                    true;


                extensionModal.hide();


                editForm.requestSubmit();
            }
        );


        modalElement.addEventListener(
            'hidden.bs.modal',
            function () {

                if (!reasonConfirmed) {

                    reasonHidden.value =
                        '';
                }
            }
        );

    }
);

</script>


</body>

</html>
